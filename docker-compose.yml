services:
  gd-sei-backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      - HOST=0.0.0.0
    ports:
      - "8080:8080"
    restart: unless-stopped

  gd-sei-frontend:
    build:
      context: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      - gd-sei-backend
    restart: unless-stopped
